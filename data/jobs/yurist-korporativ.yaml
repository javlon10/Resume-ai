criteria_guidance:
  hard_skills: >
    shartnoma huquqi, mehnat qonunchiligi, protsessual hujjatlar tayyorlash,
    huquqiy ekspertiza va xulosalar yozish ko'nikmasi, huquqiy bazalar bilan
    ishlash. Umumiy IT ko'nikmalari hisobga olinmaydi.
  education: >
    yuridik diplom MAJBURIY. Boshqa yo'nalishdagi diplom bu vakansiya uchun
    mos emas, qancha tajriba bo'lsa ham.
  domain: >
    korporativ sektor, ishlab chiqarish, savdo yoki xizmat ko'rsatish
    kompaniyasida ishlagan tajriba. Faqat davlat organida ishlagan bo'lsa,
    biznes muhitiga moslashish savoli tug'iladi.
